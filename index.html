<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Scan Fix</title>
<style>
*{font-family:sans-serif;box-sizing:border-box}body{margin:0;background:#0a1a14;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:20px}
video{width:100%;max-width:360px;height:360px;border-radius:24px;object-fit:cover;border:4px solid #1b8a5a;transform:scaleX(-1);background:#111}
.btn{margin-top:15px;padding:14px 24px;background:#1b8a5a;color:#fff;border:0;border-radius:12px;font-weight:700;cursor:pointer;font-size:16px;width:100%;max-width:360px}
#card{display:none;background:#151515;padding:20px;border-radius:18px;margin-top:20px;width:100%;max-width:360px;text-align:center;border:1px solid #222}
#card img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:3px solid #1b8a5a}
.scan-line{width:100%;height:4px;background:#1b8a5a;animation:scan 2s infinite;display:none;margin-top:10px}
@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(340px)}100%{transform:translateY(0)}}
</style>
</head>
<body>
<h2>🌿 Face Scan Talking - FIX</h2>
<video id="video" autoplay playsinline muted></video>
<div class="scan-line" id="scanLine"></div>
<p id="status" style="margin-top:12px;opacity:.8;text-align:center">Klik tombol untuk aktifkan kamera</p>

<button class="btn" id="btnCam" onclick="startCam()">📷 AKTIFKAN KAMERA</button>
<button class="btn" id="btnScan" onclick="doScan()" style="display:none;background:#fff;color:#1b8a5a">🔍 SCAN WAJAH SEKARANG</button>

<div id="card">
<img id="avatar" src="">
<h2 id="nama"></h2>
<p id="info" style="opacity:.7;font-size:14px"></p>
<div style="background:#1e1e1e;padding:12px;border-radius:10px;margin-top:10px" id="ucapan"></div>
<button class="btn" onclick="bicara()">🔊 Bicara Lagi</button>
<button class="btn" style="background:#333" onclick="location.reload()">Scan Ulang</button>
</div>

<script>
const video=document.getElementById('video');
const statusEl=document.getElementById('status');
const btnCam=document.getElementById('btnCam');
const btnScan=document.getElementById('btnScan');
const scanLine=document.getElementById('scanLine');

const personas=[
{nama:"Aisyah Zahra", gender:"Perempuan", umur:22, desc:"Guru DTA Miftahul Falah", foto:"https://randomuser.me/api/portraits/women/44.jpg", suara:"Halo, aku Aisyah Zahra dari DTA Miftahul Falah, senang bertemu denganmu"},
{nama:"Fatimah Azzahra", gender:"Perempuan", umur:21, desc:"Santri Tahfidz", foto:"https://randomuser.me/api/portraits/women/65.jpg", suara:"Assalamualaikum, aku Fatimah, aku suka mengaji dan menghafal Quran"},
{nama:"Nurul Huda", gender:"Perempuan", umur:23, desc:"Ustadzah Muda", foto:"https://randomuser.me/api/portraits/women/68.jpg", suara:"Hai, aku Nurul Huda, aku mengajar akhlak di DTA"},
];
let current=null;
let stream=null;

async function startCam(){
 statusEl.innerText='Meminta izin kamera...';
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}, audio:false});
  video.srcObject=stream;
  await video.play();
  statusEl.innerText='Kamera aktif! Posisikan wajah di tengah lalu klik Scan';
  btnCam.style.display='none';
  btnScan.style.display='block';
 }catch(err){
  statusEl.innerHTML='❌ Kamera gagal: '+err.message+'<br><br>Solusi:<br>1. Buka lewat Chrome<br>2. Harus HTTPS (Github Pages sudah HTTPS)<br>3. Izinkan kamera di pengaturan HP';
  console.log(err);
 }
}

function doScan(){
 scanLine.style.display='block';
 statusEl.innerText='🔍 Scanning wajah... 0%';
 let p=0;
 let interval=setInterval(()=>{
  p+=10;
  statusEl.innerText=`🔍 Scanning wajah... ${p}% - Mendeteksi ${p>50?'mata':'wajah'}...`;
  if(p>=100){
   clearInterval(interval);
   scanLine.style.display='none';
   showResult();
  }
 },150);
}

function showResult(){
 current=personas[Math.floor(Math.random()*personas.length)];
 document.getElementById('avatar').src=current.foto;
 document.getElementById('nama').innerText=current.nama;
 document.getElementById('info').innerText=current.gender+' | '+current.umur+' Tahun | '+current.desc;
 document.getElementById('ucapan').innerText='"'+current.suara+'"';
 document.getElementById('card').style.display='block';
 statusEl.innerText='✅ Scan berhasil! '+current.nama+' terdeteksi';
 bicara();
 btnScan.style.display='none';
}

function bicara(){
 if(!current) return;
 const u=new SpeechSynthesisUtterance(current.suara);
 u.lang='id-ID'; u.rate=0.95; u.pitch=1.25;
 speechSynthesis.cancel(); speechSynthesis.speak(u);
}
</script>
</body>
</html>
