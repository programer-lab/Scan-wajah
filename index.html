<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Scan Talking</title>
<style>
body{margin:0;background:#0f0f0f;color:#fff;font-family:Poppins,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
h1{margin-top:30px}video{width:360px;height:360px;border-radius:20px;object-fit:cover;border:4px solid #1b8a5a;transform:scaleX(-1)}
#card{display:none;background:#1c1c1c;padding:20px;border-radius:16px;margin-top:20px;width:360px;text-align:center}
#card img{width:100px;height:100px;border-radius:50%;object-fit:cover}
.btn{margin-top:20px;padding:12px 20px;background:#1b8a5a;color:#fff;border:0;border-radius:10px;font-weight:600;cursor:pointer;font-size:16px}
#status{margin-top:15px;opacity:.7}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body>
<h1>🌿 Face Scan AI</h1>
<video id="video" autoplay muted playsinline></video>
<div id="status">Loading model wajah...</div>
<button class="btn" id="btnScan" style="display:none" onclick="scan()">🔍 SCAN WAJAH</button>

<div id="card">
<img id="avatar" src="">
<h2 id="nama">-</h2>
<p id="desc">-</p>
<p id="ucapan" style="background:#222;padding:12px;border-radius:10px;margin-top:10px"></p>
<button class="btn" onclick="bicara()">🔊 Bicara Lagi</button>
<button class="btn" style="background:#333" onclick="location.reload()">Scan Ulang</button>
</div>

<script>
const video=document.getElementById('video');
const statusEl=document.getElementById('status');
const btnScan=document.getElementById('btnScan');

// DATA PERSONA CEWEK / COWOK
const personas=[
{nama:"Aisyah Zahra", gender:"Perempuan", umur:22, desc:"Mahasiswi DTA Miftahul Falah, ramah dan ceria", foto:"https://randomuser.me/api/portraits/women/44.jpg", suara:"Halo! Aku Aisyah Zahra, senang bertemu denganmu!"},
{nama:"Fatimah Azzahra", gender:"Perempuan", umur:21, desc:"Guru Ngaji, penyayang dan lembut", foto:"https://randomuser.me/api/portraits/women/65.jpg", suara:"Assalamualaikum, aku Fatimah. Terima kasih sudah scan wajahku!"},
{nama:"Nurul Huda", gender:"Perempuan", umur:23, desc:"Santri berprestasi, suka tahfidz", foto:"https://randomuser.me/api/portraits/women/68.jpg", suara:"Hai, aku Nurul Huda. Aku suka menghafal Quran."},
{nama:"Zidan Al-Fatih", gender:"Laki-laki", umur:24, desc:"Ustadz Muda DTA", foto:"https://randomuser.me/api/portraits/men/32.jpg", suara:"Halo, saya Zidan. Saya pengajar di DTA Miftahul Falah."}
];
let currentPersona=null;

async function init(){
 await faceapi.nets.tinyFaceDetector.loadFromUri('https://justadudewhohacks.github.io/face-api.js/models');
 statusEl.innerText='Model siap! Aktifkan kamera...';
 try{
  const stream=await navigator.mediaDevices.getUserMedia({video:true});
  video.srcObject=stream;
  statusEl.innerText='Kamera aktif. Posisikan wajah di tengah';
  btnScan.style.display='block';
 }catch(e){ statusEl.innerText='Gagal akses kamera: '+e.message; }
}

async function scan(){
 statusEl.innerText='Mendeteksi wajah...';
 const detection=await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions());
 if(!detection){ statusEl.innerText='Wajah tidak terdeteksi, coba lagi lebih dekat!'; return; }
 statusEl.innerText='Wajah terdeteksi! Membuat persona...';
 // pilih persona random
 currentPersona=personas[Math.floor(Math.random()*personas.length)];
 document.getElementById('avatar').src=currentPersona.foto;
 document.getElementById('nama').innerText=currentPersona.nama + ' - ' + currentPersona.gender;
 document.getElementById('desc').innerText=currentPersona.desc + ' | Umur ' + currentPersona.umur;
 document.getElementById('ucapan').innerText='"'+currentPersona.suara+'"';
 document.getElementById('card').style.display='block';
 bicara();
 statusEl.innerText='Scan berhasil!';
}

function bicara(){
 if(!currentPersona) return;
 const utter=new SpeechSynthesisUtterance(currentPersona.suara);
 utter.lang='id-ID';
 utter.rate=0.9;
 utter.pitch= currentPersona.gender=='Perempuan'?1.3:0.9;
 speechSynthesis.cancel();
 speechSynthesis.speak(utter);
}

init();
</script>
</body>
</html>
